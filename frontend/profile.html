<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; background: #f0f4f8;">
    <div id="sidebar-placeholder"></div>
    
    <main class="profile-main">
        <!-- Attractive Gradient Background Header -->
        <div class="profile-header-bg"></div>
        
        <div class="profile-card">
            <!-- Profile Picture Section -->
            <div class="profile-image-container">
                <img id="profile-img-preview" src="images/logo.svg" alt="Profile">
                <label for="profile-upload" class="upload-btn">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="profile-upload" accept="image/*" class="hidden">
            </div>

            <!-- Profile Info & Edit Section -->
            <div class="profile-info">
                <h2 id="display-name">Virat Saini</h2>
                <p id="display-email">virat@example.com</p>
                
                <!-- Hidden inputs jo "Edit" click karne par show honge -->
                <input type="text" id="edit-name" class="edit-input hidden" value="Virat Saini">
                <input type="email" id="edit-email" class="edit-input hidden" value="virat@example.com">
            </div>

            <div class="profile-actions">
                <button id="edit-profile-btn" class="btn btn-outline">Edit Profile</button>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
