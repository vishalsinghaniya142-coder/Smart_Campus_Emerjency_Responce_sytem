<!-- components/alert-card.html -->
<!-- This is a template used by JavaScript to render dynamic alerts -->
<template id="alert-card-template">
    <div class="alert-card alert-dynamic" style="padding: 1.5rem; margin-bottom: 1rem; border-radius: 6px; display: flex; flex-direction: column; gap: 0.5rem; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid gray;">
        <h3 class="alert-title" style="display: flex; align-items: center; gap: 10px; margin: 0;">
            <i class="fas fa-info-circle alert-icon"></i> 
            <span class="title-text">Alert Title</span>
        </h3>
        <p class="alert-message" style="margin: 0; color: #475569;">Alert detailed message goes here.</p>
        <span class="alert-time" style="font-size: 0.8rem; color: #94a3b8; margin-top: 5px;">Time: Just now</span>
    </div>
</template>
