<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SafeGuard</title>
    <!-- Yahan saari CSS files link kar di hain -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css"> 
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: #f4f7f9;">
    <!-- Navbar yahan aayega -->
    <div id="navbar-placeholder"></div>
    
    <main class="container" style="padding: 6rem 20px 4rem; max-width: 600px; flex: 1;">
        <h1 style="text-align: center; color: var(--text-dark);">Contact Administration</h1>
        
        <form class="contact-form" style="background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 2rem;">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>Name</label>
                <input type="text" required placeholder="Enter your full name" style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>Email</label>
                <input type="email" required placeholder="Enter your email address" style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Message</label>
                <textarea rows="5" required placeholder="How can we help you?" style="width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; resize: vertical;"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1.1rem; border-radius: 6px;">Send Message</button>
        </form>
    </main>

    <!-- Footer yahan aayega -->
    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
</body>
</html>
