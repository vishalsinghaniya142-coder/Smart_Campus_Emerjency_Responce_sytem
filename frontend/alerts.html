<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alerts - Suraksha_Setu</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/alerts.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/favicon.svg"
    >
</head>

<body style="display: flex;">

    <div id="sidebar-placeholder"></div>

    <main style="flex: 1; padding: 2rem; margin-left: 250px;">

        <h1>Live Alerts</h1>

        <!-- Backend alerts will be loaded here -->
        <div
            id="alerts-container"
            style="margin-top: 2rem;"
        >
            <p>
                <i class="fas fa-spinner fa-spin"></i>
                Loading alerts...
            </p>
        </div>

    </main>


    <!-- Common API helper -->
    <script src="js/api.js"></script>

    <!-- Existing frontend functionality -->
    <script src="js/main.js?v=3"></script>

    <!-- Alerts backend integration -->
    <script src="js/alerts.js?v=3"></script>

</body>
</html>
