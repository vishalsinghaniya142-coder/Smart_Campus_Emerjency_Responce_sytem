<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shelters - Suraksha_Setu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/shelters.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body style="display: flex;">
    <div id="sidebar-placeholder"></div>

    <main style="flex: 1; padding: 2rem; margin-left: 250px;">
        <h1>Nearby Relief Shelters</h1>

        <section class="shelter-form-panel" aria-labelledby="add-shelter-heading">
            <div class="shelter-form-heading">
                <div>
                    <p class="shelter-eyebrow">Firebase directory</p>
                    <h2 id="add-shelter-heading">Add a shelter</h2>
                </div>
                <button id="use-current-location" class="btn btn-outline" type="button">
                    <i class="fas fa-location-crosshairs" aria-hidden="true"></i> Use current location
                </button>
            </div>
            <form id="add-shelter-form" class="shelter-form">
                <input id="shelter-name" required minlength="2" placeholder="Shelter name" aria-label="Shelter name">
                <input id="shelter-address" placeholder="Address" aria-label="Address">
                <input id="shelter-latitude" required type="number" step="any" min="-90" max="90" placeholder="Latitude" aria-label="Latitude">
                <input id="shelter-longitude" required type="number" step="any" min="-180" max="180" placeholder="Longitude" aria-label="Longitude">
                <input id="shelter-capacity" required type="number" min="0" placeholder="Total capacity" aria-label="Total capacity">
                <select id="shelter-status" aria-label="Shelter status">
                    <option value="available">Available</option>
                    <option value="limited">Limited</option>
                    <option value="full">Full</option>
                    <option value="closed">Closed</option>
                </select>
                <button class="btn btn-primary" type="submit">Save shelter</button>
            </form>
            <p id="add-shelter-status" class="shelter-form-status" role="status"></p>
        </section>

        <p id="shelters-list-status" role="status">Loading shelters from Firebase...</p>
        <div id="shelter-grid" class="shelter-grid" aria-live="polite">
            <p>Loading shelters...</p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/location.js"></script>
    <script src="js/main.js?v=3"></script>
    <script src="js/shelters.js?v=4"></script>
</body>
</html>
