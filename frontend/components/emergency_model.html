<!-- components/emergency-modal.html -->
<div id="emergency-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 500px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(220,38,38,0.3);">
        <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: var(--danger-color); margin-bottom: 1rem;"></i>
        <h2 style="color: var(--danger-color); margin-bottom: 1rem;">EMERGENCY ALERT</h2>
        <p id="modal-alert-message" style="margin-bottom: 2rem; font-size: 1.1rem;">A severe emergency has been reported in your vicinity. Please follow safety protocols immediately.</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="shelters.html" class="btn btn-primary">Find Shelter</a>
            <button onclick="document.getElementById('emergency-modal').style.display='none'" class="btn btn-outline">Dismiss</button>
        </div>
    </div>
</div>
