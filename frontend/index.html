<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-bg">
    <div id="navbar-placeholder"></div>
    
    <div class="container form-container">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Login to your SafeGuard account</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <!-- Social Login Section -->
        <div class="auth-divider">
            <span>OR</span>
        </div>
        
        <div class="social-login">
            <button type="button" class="btn btn-outline social-btn" id="google-login">
                <i class="fab fa-google" style="color: #db4437;"></i> Continue with Google
            </button>
            <button type="button" class="btn btn-outline social-btn" id="github-login">
                <i class="fab fa-github" style="color: #333;"></i> Continue with GitHub
            </button>
        </div>

        <p class="auth-footer">New user? <a href="register.html">Create an account</a></p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
