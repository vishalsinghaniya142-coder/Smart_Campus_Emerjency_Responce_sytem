<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; background: #f4f7f9;">
    <div id="sidebar-placeholder"></div>
    
    <main class="profile-main">
        <div class="profile-header-bg">
            <div class="wave"></div>
        </div>
        
        <div class="profile-card">
            <!-- Profile Picture Section -->
            <div class="profile-image-container">
                <img id="profile-img-preview" src="images/logo.svg" onerror="this.src='images/logo.png'" alt="Profile">
                
                <!-- Upload Camera Button -->
                <label for="profile-upload" class="upload-btn" title="Upload Photo">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="profile-upload" accept="image/*" class="hidden">
                
                <!-- Remove Photo Button -->
                <button id="remove-pic-btn" class="remove-btn" title="Remove Photo">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            
            

            <!-- Header Info -->
            <div class="profile-info-header">
                <h2 id="disp-name">Virat Saini</h2>
                <p id="disp-email">virat@example.com</p>
                <!-- Edit Header (Hidden) -->
                <input type="text" id="edit-name" class="edit-input hidden" placeholder="Full Name">
                <input type="email" id="edit-email" class="edit-input hidden" placeholder="Gmail Address">
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

            <!-- DISPLAY MODE GRID -->
            <div id="display-section" class="profile-details">
                <div class="detail-grid">
                    <div class="detail-item"><i class="fas fa-user-tag"></i> <strong>Username:</strong> <span id="disp-username">@viratsaini</span></div>
                    <div class="detail-item"><i class="fas fa-briefcase"></i> <strong>Role:</strong> <span id="disp-role">Engineering Student</span></div>
                    <div class="detail-item"><i class="fas fa-laptop-code"></i> <strong>Branch:</strong> <span id="disp-branch">Computer Science</span></div>
                    <div class="detail-item"><i class="fas fa-door-closed"></i> <strong>Hostel Room No:</strong> <span id="disp-hostel">B-302</span></div>
                    <div class="detail-item"><i class="fas fa-phone"></i> <strong>Phone Number:</strong> <span id="disp-phone">+91 9876543210</span></div>
                    <div class="detail-item"><i class="fas fa-map-marker-alt"></i> <strong>Address:</strong> <span id="disp-address">Campus Hostel</span></div>
                </div>
                <div class="bio-section">
                    <strong><i class="fas fa-info-circle"></i> Bio:</strong>
                    <p id="disp-bio">Passionate about full-stack development and community projects.</p>
                </div>
            </div>

            <!-- EDIT MODE GRID (Hidden by default) -->
            <div id="edit-section" class="profile-details hidden">
                <div class="detail-grid">
                    <div class="form-group"><label>Username</label><input type="text" id="edit-username" class="edit-input-grid"></div>
                    <div class="form-group"><label>Role</label><input type="text" id="edit-role" class="edit-input-grid"></div>
                    <div class="form-group"><label>Branch</label><input type="text" id="edit-branch" class="edit-input-grid"></div>
                    <div class="form-group"><label>Hostel Room No</label><input type="text" id="edit-hostel" class="edit-input-grid"></div>
                    <div class="form-group"><label>Phone Number</label><input type="text" id="edit-phone" class="edit-input-grid"></div>
                    <div class="form-group"><label>Address</label><input type="text" id="edit-address" class="edit-input-grid"></div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Bio</label>
                    <textarea id="edit-bio" class="edit-input-grid" rows="3"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="profile-actions" style="margin-top: 25px;">
                <button id="edit-profile-btn" class="btn btn-outline"><i class="fas fa-edit"></i> Edit Profile</button>
                <button id="logout-btn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
