<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div id="sidebar-placeholder"></div>

    <main class="dashboard-main">
        <header class="dash-header">
            <div>
                <h1>Dashboard</h1>
                <p>Welcome back, <span id="dash-username" style="color:var(--primary-color); font-weight:bold;">User</span></p>
            </div>
            <!-- EMERGENCY SOS BUTTON -->
            <button id="btn-sos" class="btn btn-danger pulse-btn">
                <i class="fas fa-exclamation-triangle"></i> EMERGENCY SOS
            </button>
        </header>

        <div class="stats-grid">
            <!-- 1. Risk Level Card (Dropdown Selector) -->
            <div class="stat-card" id="card-risk">
                <div class="card-icon" style="color: #f59e0b;"><i class="fas fa-exclamation-circle"></i></div>
                <div class="card-info">
                    <h3>Risk Level</h3>
                    <select id="risk-selector" class="risk-select">
                        <option value="low">Low</option>
                        <option value="moderate" selected>Moderate</option>
                        <option value="high">High</option>
                        <option value="severe">Severe</option>
                    </select>
                </div>
            </div>

            <!-- 2. Nearest Shelter Card (Clickable) -->
            <div class="stat-card clickable-card" onclick="window.location.href='shelters.html'">
                <div class="card-icon" style="color: #2563eb;"><i class="fas fa-campground"></i></div>
                <div class="card-info">
                    <h3>Nearest Shelter</h3>
                    <h2 id="shelter-text">Community Hall (2km)</h2>
                    <span class="click-hint">Click to view map &rarr;</span>
                </div>
            </div>

            <!-- 3. Active Alerts Card (Clickable) -->
            <div class="stat-card clickable-card" onclick="window.location.href='alerts.html'">
                <div class="card-icon" style="color: #dc2626;"><i class="fas fa-bell"></i></div>
                <div class="card-info">
                    <h3>Active Alerts</h3>
                    <h2 id="alerts-text">2 Warnings</h2>
                    <span class="click-hint">Click to view details &rarr;</span>
                </div>
            </div>
        </div>

        <!-- Recent Activity Feed -->
        <div class="dash-bottom">
            <div class="activity-feed">
                <h3><i class="fas fa-bolt" style="color: #f59e0b;"></i> Live System Activity</h3>
                <ul id="activity-list">
                    <li><i class="fas fa-check-circle" style="color: #16a34a;"></i> SafeGuard System initialized successfully.</li>
                    <li><i class="fas fa-cloud-showers-heavy" style="color: #3b82f6;"></i> Weather API synced: Normal conditions.</li>
                </ul>
            </div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
