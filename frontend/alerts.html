<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alerts - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex;">
    <div id="sidebar-placeholder"></div>
    
    <main style="flex: 1; padding: 2rem; margin-left: 250px;">
        <h1>Live Alerts</h1>
        <div style="margin-top: 2rem;">
            <!-- Alert 1 -->
            <div style="background: #fee2e2; border-left: 5px solid #dc2626; padding: 1rem; margin-bottom: 1rem; border-radius: 4px;">
                <h3 style="color: #991b1b;"><i class="fas fa-exclamation-circle"></i> RED ALERT: Severe Flooding</h3>
                <p style="color: #7f1d1d;">Evacuate low-lying areas in Sector 4 immediately. Rescue teams deployed.</p>
            </div>
            <!-- Alert 2 -->
            <div style="background: #fef3c7; border-left: 5px solid #f59e0b; padding: 1rem; margin-bottom: 1rem; border-radius: 4px;">
                <h3 style="color: #b45309;"><i class="fas fa-exclamation-triangle"></i> YELLOW ALERT: Heavy Rainfall</h3>
                <p style="color: #92400e;">Expected continuous rain for next 48 hours. Keep emergency kits ready.</p>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
