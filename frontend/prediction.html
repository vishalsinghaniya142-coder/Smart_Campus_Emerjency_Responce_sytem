<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Prediction - SafeGuard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/prediction.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; background: #f4f7f9;">
    <div id="sidebar-placeholder"></div>
    
    <main class="prediction-main">
        <div class="prediction-header">
            <h1><i class="fas fa-brain" style="color: var(--primary-color);"></i> AI Disaster Prediction</h1>
            <p>Enter your location to get real-time AI analysis of potential environmental threats.</p>
        </div>
        
        <div class="prediction-card">
            <!-- Input Area -->
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="location-input" placeholder="Enter City (e.g. Lucknow) or Pincode">
                <button id="analyze-btn" class="btn btn-primary">Analyze Risk</button>
            </div>
            
            <!-- AI Processing Loader (Hidden by default) -->
            <div id="ai-loader" class="hidden" style="text-align: center; margin: 30px 0;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--primary-color);"></i>
                <p style="margin-top: 10px; color: var(--text-light); font-weight: 500;">AI is analyzing satellite data and historical patterns...</p>
            </div>

            <!-- Dynamic Results Area (Hidden by default) -->
            <div id="prediction-results" class="results-container hidden">
                <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px;">
                    Threat Analysis for: <span id="result-location" style="color: var(--primary-color);">Location</span>
                </h3>
                
                <!-- Risk Item 1 -->
                <div class="risk-item">
                    <div class="risk-label">
                        <span><i class="fas fa-water" style="color: #3b82f6;"></i> Flood Risk</span>
                        <span id="flood-val" class="risk-value">0%</span>
                    </div>
                    <div class="progress-bg"><div id="flood-bar" class="progress-fill" style="background: #3b82f6;"></div></div>
                </div>

                <!-- Risk Item 2 -->
                <div class="risk-item">
                    <div class="risk-label">
                        <span><i class="fas fa-house-damage" style="color: #8b5cf6;"></i> Earthquake Probability</span>
                        <span id="quake-val" class="risk-value">0%</span>
                    </div>
                    <div class="progress-bg"><div id="quake-bar" class="progress-fill" style="background: #8b5cf6;"></div></div>
                </div>

                <!-- Risk Item 3 -->
                <div class="risk-item">
                    <div class="risk-label">
                        <span><i class="fas fa-cloud-showers-heavy" style="color: #f59e0b;"></i> Severe Weather</span>
                        <span id="weather-val" class="risk-value">0%</span>
                    </div>
                    <div class="progress-bg"><div id="weather-bar" class="progress-fill" style="background: #f59e0b;"></div></div>
                </div>
                
                <div id="ai-conclusion" class="ai-alert">
                    <!-- AI warning text will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/prediction.js"></script>
</body>
</html>
