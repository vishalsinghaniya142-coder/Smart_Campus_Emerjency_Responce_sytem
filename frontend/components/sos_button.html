<!-- components/sos-button.html -->
<button class="btn btn-danger pulse-animation" onclick="triggerGlobalSOS()" style="padding: 15px 30px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border-radius: 8px;">
    <i class="fas fa-exclamation-triangle"></i>
    <span>PRESS FOR SOS</span>
</button>

<style>
    .pulse-animation {
        animation: dangerPulse 1.5s infinite;
    }
    @keyframes dangerPulse {
        0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
        100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
</style>

<script>
    function triggerGlobalSOS() {
        if(window.NotificationSystem) {
            window.NotificationSystem.triggerSOS();
        } else {
            alert("EMERGENCY SOS TRIGGERED! Authorities are being notified.");
        }
    }
</script>
